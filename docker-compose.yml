services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hdms_user
      POSTGRES_PASSWORD: hdms_pass
      POSTGRES_DB: hdms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hdms_user -d hdms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # When running inside docker-compose, the Vite dev server proxies /api to
      # the "backend" service via the proxy config in vite.config.ts.
      # For direct browser access (outside docker) set VITE_API_URL in frontend/.env.
      VITE_API_URL: ""
    depends_on:
      - backend

volumes:
  pgdata:
