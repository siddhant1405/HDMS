databases:
  - name: hdms-db
    databaseName: hdms
    user: hdms_user
    plan: free

services:
  - type: web
    name: hdms-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: hdms-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: FERNET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: cron
    name: keep-hdms-awake
    runtime: python
    plan: free
    schedule: "*/14 * * * *"
    command: python -c "import urllib.request; urllib.request.urlopen('http://hdms-backend:8000/api/v1/health')"
